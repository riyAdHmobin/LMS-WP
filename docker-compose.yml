version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: lms-demo
    restart: always
    ports:
      - "8803:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: lms_demo_db
    volumes:
      - ./wordpress:/var/www/html

  db:
    image: mysql:8.3.0
    container_name: mysql-lms-demo-db
    restart: always
    environment:
      MYSQL_DATABASE: lms_demo_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-lms-demo-db
    restart: always
    ports:
      - "8804:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data: